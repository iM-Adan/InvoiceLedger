<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InvoiceFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%231B2430'/><path d='M10 11h12M10 16h12M10 21h7' stroke='white' stroke-width='2.6' stroke-linecap='round'/></svg>" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/process" aria-label="InvoiceFlow home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M10 11h12M10 16h12M10 21h7" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
      InvoiceFlow
    </a>
    <nav class="tabs" id="tabs">
      <span class="tab-ind" id="tab-ind"></span>
      <a href="#/process" data-nav="process">Process</a>
      <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
      <a href="#/pos" data-nav="pos">Purchase orders</a>
      <a href="#/rules" data-nav="rules">Rules</a>
    </nav>
    <div class="top-right">
      <span class="engine" id="engine"></span>
      <div class="menu">
        <button class="icon-btn" id="menu-btn" aria-label="More" aria-haspopup="true">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        </button>
        <div class="menu-pop" id="menu-pop" role="menu">
          <button role="menuitem" id="reset-btn">Reset demo data</button>
          <p>Clears every run and restores the purchase orders to their starting balances.</p>
        </div>
      </div>
    </div>
  </header>

  <main id="view" class="view"></main>

  <div class="drop-overlay" id="drop-overlay"><div><svg viewBox="0 0 24 24"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>Drop to process this invoice</div></div>
  <aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-scrim" data-close></div><div class="drawer-panel" id="drawer-panel"></div></aside>
  <div class="lightbox" id="lightbox" data-close><img alt="Invoice" /></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
